# 生产环境配置 - 阿里云ECS Docker部署
server:
  port: 8080

spring:
  datasource:
    # Docker 环境中用容器名 mysql 连接，不是 localhost
    url: jdbc:mysql://mysql:3306/cryd?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      # 首次部署用 update 自动建表，稳定后可改为 validate
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true

# Docker 容器内文件路径（与 docker-compose.yml volume 映射对应）
system:
  storage:
    resources-path: /app/data/resources
    audio-chapters-path: /app/data/audio/chapters

rag:
  knowledge-import:
    base-path: /app/data/knowledge-base

# 生产环境：MiMo TTS 参考音频路径（容器内路径，对应 docker-compose volume 挂载）
mimo:
  tts:
    reference-voice-path: /app/data/reference.wav